# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/factshare}

# Server
server.port=${PORT:5001}

# Gemini Service
gemini.service.url=${GEMINI_SERVICE_URL:http://localhost:5002}

# Minimax Service (NVIDIA NIM) — text-only chat completions
minimax.service.url=${MINIMAX_SERVICE_URL:http://localhost:5003}

# JWT
jwt.secret=factshare_jwt_secret_key_that_is_long_enough_for_hs256_algorithm_2025
jwt.expiration=86400000

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Multipart file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
