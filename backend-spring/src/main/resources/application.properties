# Database
# Production: set JDBC_DATABASE_URL (e.g. jdbc:postgresql://host:5432/factshare)
#            plus DATABASE_USER / DATABASE_PASSWORD.
# Local dev: defaults to an in-memory H2 database - no external DB needed.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:factshare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server
server.port=${PORT:5001}

# Gemini Service
gemini.service.url=${GEMINI_SERVICE_URL:http://localhost:5002}

# Minimax Service (NVIDIA NIM) — text-only chat completions
minimax.service.url=${MINIMAX_SERVICE_URL:http://localhost:5003}

# JWT
jwt.secret=factshare_jwt_secret_key_that_is_long_enough_for_hs256_algorithm_2025
jwt.expiration=86400000

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Multipart file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
